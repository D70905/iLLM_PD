# config/rl_default.yaml — Phase 2BC + 2D (6-layer + LLM + surrogate)
# ===================================================================
# Used by examples/train_ppo_integrated.py and rl/train.py
# LLM-specific behavior in config/llm_config.yaml

total_timesteps: 8000

# ────────────────────────────────────────────────────────────
# Env
# ────────────────────────────────────────────────────────────
env:
  protocol_name: "JTG_D50_2017"

  # 6-layer initial design (top-down): upper AC / mid AC / lower AC / base / subbase
  init_thickness_m: [0.04, 0.06, 0.08, 0.36, 0.18]
  init_modulus_MPa: [14000, 11000, 9000, 1500, 400]
  init_poisson:     [0.25, 0.30, 0.30, 0.25, 0.35]

  # Subgrade + load (BZZ-100)
  E_subgrade: 60.0
  nu_subgrade: 0.40
  load_pressure_MPa: 0.7
  load_radius_m: 0.1065

  # Design context (drives spec evaluation)
  # pavement_type controls BOTH the spec branch (e.g., JTG B.2 only for semi_rigid)
  # AND the surrogate input flag is_semi_rigid (Phase 2D dual-base).
  # Allowed: "semi_rigid" (cement/lime-stabilized base, GPS-2 ACAB)
  #          "flexible"   (unbound granular base, GPS-1 ACUB)
  city: "beijing"               # training reference; per-section inference sets city="" + climate_zone
  climate_zone: ""             # JTG zone fallback: cold|temperate|warm|hot|tropical (empty=use city)
  road_class: "expressway"
  traffic_level: "heavy"
  pavement_type: "semi_rigid"
  design_life_years: 15

  # Action scales
  action_dh_max_m:   0.02     # ±2 cm/step/layer
  action_dE_max_MPa: 100.0    # ±100 MPa/step/layer

  # Episode
  max_episode_steps: 20
  max_episodes: 400            # 8000 timesteps / 20 steps = 400 episodes

  # FEA temp dirs
  fea_keep_runs: false         # set true only when debugging

# ────────────────────────────────────────────────────────────
# Phase 2D — Surrogate routing (v3 dual-base supported)
# ────────────────────────────────────────────────────────────
# When use_surrogate is true, train.py constructs PavementEnvWithSurrogate
# and the surrogate runs in the mode matching env.pavement_type:
#   - v3 checkpoint (in_dim=12): works for both pavement_type values
#   - v2 checkpoint (in_dim=11): only works with pavement_type=semi_rigid
surrogate:
  use_surrogate: true
  model_path: "./output/surrogate_model/surrogate_v3.pt"   # v3 = dual-base
  fea_validation_every: 10
  b3_threshold: 1.2

# ────────────────────────────────────────────────────────────
# PPO hyperparameters
# ────────────────────────────────────────────────────────────
ppo:
  learning_rate:    0.0003
  n_steps:          64
  batch_size:       16
  n_epochs:         4
  gamma:            0.99
  gae_lambda:       0.95
  clip_range:       0.2
  ent_coef:         0.005
  vf_coef:          0.5
  max_grad_norm:    0.5
  target_kl:        0.05
  policy_kwargs:
    net_arch: [64, 64]
    activation: "tanh"
  verbose: 1
  device: "auto"      # auto = cuda if available, else cpu

# ────────────────────────────────────────────────────────────
# IO
# ────────────────────────────────────────────────────────────
io:
  runs_root: "./output/rl_runs"
  save_freq: 50                # checkpoint every N timesteps

# ────────────────────────────────────────────────────────────
# Logging
# ────────────────────────────────────────────────────────────
logging:
  log_every_n_steps: 10        # screen summary every N global steps
