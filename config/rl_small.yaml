# iLLM-PD HARA - Small-scale training (200 ts, 6-layer model)
# ===============================================================
# Estimated time: ~40 minutes (FEA ~11s × 220 calls)

env:
  spec_name: JTG_D50_2017
  initial_thickness: [0.04, 0.06, 0.08, 0.36, 0.18]
  initial_modulus:   [14000.0, 11000.0, 9000.0, 1500.0, 400.0]
  initial_poisson:   [0.25, 0.30, 0.30, 0.25, 0.35]
  E_subgrade: 60.0
  nu_subgrade: 0.40

  pavement_type: semi_rigid
  road_class:    expressway
  traffic_level: heavy
  design_life:   15
  extras:
    city: beijing
    ac_grade: modified_asphalt_SBS
    base_type: inorganic_stabilized_granular
    construction_type: new_construction
    frost_zone: non_frost
    VFA_pct: 70.0
    R_s_MPa: 1.0
    R_0_mm: 1.5

  max_thickness_delta_m: 0.02
  max_modulus_delta_MPa: 100.0
  max_steps_per_episode: 10
  max_episodes:          20

  fea_load_pressure_MPa: 0.7
  fea_load_radius_m:     0.1065
  fea_num_cpus:          4
  fea_keep_runs:         false

  output_dir: ./output/rl_runs
  verbose: true

reward:
  perf_indicator_weights:
    B1_asphalt_fatigue:           0.30
    B2_semi_rigid_fatigue:        0.35
    B3_ac_permanent_deformation:  0.20
    B4_subgrade_strain:           0.15
  score_margin_failed:     0.0
  score_margin_near_fail:  0.5
  score_margin_ideal:      1.0
  score_margin_decay_rate: 0.15
  score_margin_floor:      0.2
  material_prices:        [1800.0, 1100.0, 900.0, 320.0, 180.0]
  modulus_price_coeffs:   [2.0e-5, 1.8e-5, 1.5e-5, 6.0e-5, 0.0]
  cost_target_min:        280.0
  cost_target_optimal:    380.0
  cost_target_max:        500.0
  econ_max_reward:        0.30
  guide_bonus_per_correct_layer: 0.04
  guide_penalty_idle:           -0.05
  smooth_zero_penalty:    -0.02
  smooth_small_threshold:  0.005
  smooth_ideal_low:        0.005
  smooth_ideal_high:       0.08
  smooth_ideal_peak:       0.08
  smooth_decay_rate:       8.0
  explore_per_param_change:    0.02
  explore_max_reward:          0.05
  explore_thickness_threshold: 0.01
  explore_modulus_threshold:   50.0
  tau_early_threshold: 0.30
  tau_mid_threshold:   0.70
  weights_early:
    performance: 0.40
    economic:    0.30
    guidance:    0.15
    smoothness:  0.10
    exploration: 0.05
  weights_mid:
    performance: 0.40
    economic:    0.40
    guidance:    0.10
    smoothness:  0.08
    exploration: 0.02
  weights_late:
    performance: 0.55
    economic:    0.35
    guidance:    0.05
    smoothness:  0.05
    exploration: 0.00
  final_tanh_scale:       0.8
  final_output_scale:     1.5
  feasibility_bonus:      0.30
  infeasibility_penalty: -0.30

guard:
  h_min: [0.02, 0.03, 0.04, 0.15, 0.10]
  h_max: [0.10, 0.15, 0.25, 0.60, 0.50]
  E_min: [4000.0, 3000.0, 2000.0, 500.0, 150.0]
  E_max: [25000.0, 18000.0, 15000.0, 4000.0, 1200.0]
  E_subgrade_min: 20.0
  E_subgrade_max: 200.0
  epsilon_a_max_microstrain: 5000.0
  sigma_t_max_MPa:           20.0
  epsilon_z_max_microstrain: 5000.0

ppo:
  learning_rate: 0.002
  gamma:         0.99
  clip_range:    0.2
  n_epochs:      4
  ent_coef:      0.01
  vf_coef:       0.5
  gae_lambda:    0.95
  max_grad_norm: 0.5

  # Small-scale: more frequent updates with smaller rollouts
  n_steps:       40
  batch_size:    20
  target_kl:     0.05

  hidden_dims: [128, 64]

  # 200 timesteps total ≈ 20 episodes (40 minutes on 6-layer model)
  total_timesteps: 200
  device: auto
