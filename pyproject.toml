[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illm-pd"
version = "0.2.0"
description = "Intelligent LLM-powered Pavement Design with Auditable Harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tongji University Pavement Design Group" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rl = [
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "tensorboard>=2.14",
]
agents = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "openai>=1.40",
    "anthropic>=0.30",
    "httpx>=0.27",
    "tenacity>=8.0",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=7.4",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
all = [
    "illm-pd[rl,agents,rag,dev]",
]

[tool.setuptools.packages.find]
include = ["fea*", "rl*", "agents*", "specs*", "rag*", "audit*", "tools*"]
exclude = ["tests*", "scripts*", "experiments*", "examples*",
           "knowledge_base*", "output*", "data*", "docs*",
           "third_party*", "legacy*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
